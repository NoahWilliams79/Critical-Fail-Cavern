<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Citadel Ring arena battlemap</title>
  <desc id="description">A top-down circular stone arena with tiered seating, four entry gates, and scattered cover pillars.</desc>
  <defs>
    <pattern id="stone" width="68" height="40" patternUnits="userSpaceOnUse">
      <rect width="68" height="40" fill="#8c887d"/>
