<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Grasslands battlemap</title>
  <desc id="description">A top-down grassy field crossed by a winding dirt trail, with a pond, scattered trees, rocks, and small patches of flowers.</desc>
  <defs>
    <pattern id="grass" width="38" height="38" patternUnits="userSpaceOnUse">
      <rect width="38" height="38" fill="#809b55"/>
      <path d="M5 10l3-5m6 22 3-6m11 1 4-5M8 36l2-4m23-18 2-4" stroke="#a3b66b" stroke-width="2" stroke-linecap="round" opacity=".48"/>
      <circle cx="27" cy="31" r="1.5" fill="#667f48" opacity=".5"/>
      <circle cx="16" cy="8" r="1.2" fill="#607b45" opacity=".5"/>
    </pattern>
    <pattern id="trail" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="34" height="34" fill="#c6ad79"/>
      <path d="M3 5h8m12 13h7M6 29h5" stroke="#a68b5d" stroke-width="2" stroke-linecap="round" opacity=".55"/>
      <circle cx="22" cy="5" r="1.5" fill="#e0ca96"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6eaaa0"/>
      <stop offset="1" stop-color="#397a78"/>
    </linearGradient>
    <g id="tree">
      <ellipse cx="0" cy="9" rx="28" ry="23" fill="#3c5838" opacity=".4"/>
      <circle cx="0" cy="0" r="25" fill="#355b3d"/>
      <circle cx="-11" cy="-7" r="13" fill="#527744"/>
      <circle cx="10" cy="-10" r="14" fill="#63874a"/>
      <circle cx="12" cy="8" r="12" fill="#466a3e"/>
      <circle cx="-6" cy="9" r="12" fill="#5a7d45"/>
      <circle cx="-2" cy="-2" r="4" fill="#83975a" opacity=".6"/>
    </g>
    <g id="rock">
      <ellipse cx="2" cy="5" rx="17" ry="11" fill="#475344" opacity=".35"/>
      <path d="M-15 2l5-12 13-4 12 8 3 12-10 8-17-2z" fill="#8b8b73" stroke="#5d6958" stroke-width="3"/>
      <path d="M-8-7l10-4 7 5" fill="none" stroke="#b2ae8b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="flowers">
